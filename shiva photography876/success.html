<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Successful - Shiva Photography</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #c5a059;
            --bg: #0a0a0a;
            --text: #fff;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .card {
            background: #1a1a1a;
            padding: 3rem;
            border-radius: 12px;
            border: 1px solid #333;
            max-width: 500px;
            width: 90%;
        }

        .icon {
            font-size: 4rem;
            color: #25d366;
            margin-bottom: 1rem;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 1rem;
        }

        .btn {
            display: inline-block;
            padding: 1rem 2rem;
            background: var(--primary);
            color: #000;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            margin-top: 2rem;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="icon">✓</div>
        <h1>Booking Successful!</h1>
        <p>Thank you for choosing Shiva Photography. We have received your booking and payment. Our team will contact
            you shortly.</p>
        <a href="index.html" class="btn">Back to Home</a>
    </div>
</body>

</html>
