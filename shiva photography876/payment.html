<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Your Booking - Shiva Photography</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #c5a059;
            --bg: #0a0a0a;
            --text: #fff;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .card {
            background: #1a1a1a;
            padding: 3rem;
            border-radius: 12px;
            border: 1px solid #333;
            max-width: 500px;
            width: 90%;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 1.5rem;
        }

        p {
            margin-bottom: 2rem;
            color: #888;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 1rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 1rem;
            transition: 0.3s;
            cursor: pointer;
            border: none;
        }

        .btn-razorpay {
            background: var(--primary);
            color: #000;
        }

        .btn-whatsapp {
            background: #25d366;
            color: #fff;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Confirm Payment</h1>
        <p>Thank you, <strong id="user-name">Client</strong>! Your details are saved. Please pay the advance to secure
            your slot.</p>

        <!-- Razorpay Button (using manual script here for static HTML) -->
        <button id="rzp-button" class="btn btn-razorpay">Pay Advance ₹500</button>
        <form id="payment-form" action="success_process.php" method="POST">
            <input type="hidden" name="booking_id" id="booking_id">
            <input type="hidden" name="razorpay_payment_id" id="razorpay_payment_id">
        </form>

        <p style="margin: 1.5rem 0;">OR</p>

        <a id="whatsapp-link" href="#" target="_blank" class="btn btn-whatsapp">Confirm on WhatsApp</a>
    </div>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const bookingId = urlParams.get('id');
        const name = urlParams.get('name') || 'Client';
        const email = urlParams.get('email') || '';
        const phone = urlParams.get('phone') || '';
        const date = urlParams.get('date') || '';

        document.getElementById('user-name').innerText = name;
        document.getElementById('booking_id').value = bookingId;

        const whatsappMsg = `Hello Shiva Photography, I would like to confirm my booking.\nName: ${name}\nDate: ${date}\nPhone: ${phone}`;
        document.getElementById('whatsapp-link').href = `https://wa.me/919876543210?text=${encodeURIComponent(whatsappMsg)}`;

        document.getElementById('rzp-button').onclick = function (e) {
            var options = {
                "key": "rzp_test_YOUR_KEY_ID",
                "amount": "50000",
                "currency": "INR",
                "name": "Shiva Photography",
                "description": "Advance Booking Fee",
                "image": "https://yourlogo.com/logo.png",
                "handler": function (response) {
                    document.getElementById('razorpay_payment_id').value = response.razorpay_payment_id;
                    document.getElementById('payment-form').submit();
                },
                "prefill": {
                    "name": name,
                    "email": email,
                    "contact": phone
                },
                "theme": { "color": "#c5a059" }
            };
            var rzp1 = new Razorpay(options);
            rzp1.open();
            e.preventDefault();
        }
    </script>
</body>

</html>
